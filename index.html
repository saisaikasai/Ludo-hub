<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#0f172a">
  <title>Game Hub – Ludo &amp; Party Games</title>

  <style>
:root{
  --bg:#0f172a;--panel:#1e293b;--panel2:#273449;--line:#334155;--text:#e2e8f0;--mute:#94a3b8;
  --accent:#6366f1;--accent2:#818cf8;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;
  --red:#ef4444;--green:#22c55e;--yellow:#eab308;--blue:#3b82f6;
  --r:16px;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{font:inherit;color:var(--text);background:#0b1220;border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--accent2)}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}
h2{font-size:1.25rem}h3{font-size:1rem}
.mute{color:var(--mute)}.small{font-size:.82rem}.center{text-align:center}.hidden{display:none!important}

.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#0b1220;position:sticky;top:0;z-index:30}
.logo{font-weight:800;font-size:1.1rem;display:flex;gap:8px;align-items:center}
.top-right{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--panel);font-size:1.1rem}
.badge{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--panel);color:var(--mute)}
.badge.on{background:#14532d;color:#86efac}.badge.off{background:#7f1d1d;color:#fecaca}.badge.mid{background:#78350f;color:#fde68a}

#layout{display:flex;gap:16px;max-width:1100px;margin:0 auto;padding:14px}
#stage{flex:1;min-width:0}
#social{width:340px;flex-shrink:0}
@media(max-width:860px){
  #layout{display:block;padding:10px}
  #social{position:fixed;left:0;right:0;bottom:0;width:auto;z-index:40;transform:translateY(105%);transition:transform .25s;max-height:78vh;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
  #social.open{transform:none}
}
@media(min-width:861px){.fab{display:none!important}}
.fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:35;width:56px;height:56px;border-radius:50%;background:var(--accent);font-size:1.5rem;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.fab i{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-style:normal;font-size:.7rem;font-weight:700;border-radius:99px;min-width:20px;height:20px;line-height:20px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;background:var(--accent);font-weight:700;transition:transform .1s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.12)}.btn:active:not(:disabled){transform:scale(.97)}
.btn.sec{background:var(--panel2)}.btn.good{background:#15803d}.btn.bad{background:#b91c1c}.btn.block{display:flex;width:100%}
.btn.sm{padding:8px 12px;border-radius:10px;font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.hero{text-align:center;padding:28px 10px 10px}
.hero h1{font-size:2rem}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.mode-grid{grid-template-columns:1fr}}
.mode{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:20px;padding:22px;text-align:left;display:block;width:100%}
.mode b{font-size:1.15rem;display:block;margin:6px 0 2px}
.mode .big{font-size:2.2rem}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gtile{background:var(--panel2);border:2px solid transparent;border-radius:16px;padding:14px;text-align:left}
.gtile.sel{border-color:var(--accent2);background:#312e81}
.gtile .e{font-size:1.8rem}.gtile b{display:block}
.seg{display:flex;background:#0b1220;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--accent);color:#fff}
.seat-row{display:flex;gap:8px;align-items:center;margin:8px 0}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.c-red{background:var(--red)}.c-green{background:var(--green)}.c-yellow{background:var(--yellow)}.c-blue{background:var(--blue)}
.code-box{font-size:2.2rem;font-weight:800;letter-spacing:.25em;text-align:center;background:#0b1220;border:2px dashed var(--accent2);border-radius:16px;padding:10px 0 10px .25em}

/* players bar */
.pbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pchip{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-size:.85rem;position:relative}
.pchip.turn{border-color:var(--warn);box-shadow:0 0 0 3px rgba(245,158,11,.2)}
.pchip.me::after{content:"you";font-size:.62rem;color:var(--mute);margin-left:2px}
.pchip.off{opacity:.45}
.pchip.speaking{border-color:var(--good);box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.pchip .score{font-weight:800;color:var(--accent2)}

/* ---------- Ludo board ---------- */
.board-wrap{width:100%;max-width:min(560px,calc(100vh - 230px));min-width:280px;margin:0 auto}
@media(max-width:860px){.board-wrap{max-width:100%}}
.ludo{display:grid;grid-template:repeat(15,1fr)/repeat(15,1fr);aspect-ratio:1;background:#fff;border:4px solid #0b1220;border-radius:14px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.45)}
.lc{border:1px solid #cbd5e1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;position:relative;font-size:clamp(7px,2.2vw,13px);color:#475569;user-select:none}
.lc.start-red,.lc.home-red{background:var(--red)}.lc.start-green,.lc.home-green{background:var(--green)}
.lc.start-yellow,.lc.home-yellow{background:var(--yellow)}.lc.start-blue,.lc.home-blue{background:var(--blue)}
.lc.safe::before{content:"★";position:absolute;color:#94a3b8;font-size:1.3em;opacity:.8}
.lc[class*="start-"]::before{color:#fff}
.base{display:flex;align-items:center;justify-content:center}
.base.red{background:var(--red)}.base.green{background:var(--green)}.base.yellow{background:var(--yellow)}.base.blue{background:var(--blue)}
.base-in{width:70%;height:70%;background:#fff;border-radius:14px;display:grid;grid-template:1fr 1fr/1fr 1fr;gap:12%;padding:10%;box-shadow:inset 0 2px 5px rgba(0,0,0,.25)}
.pocket{border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e2e8f0}
.base.red .pocket{background:#fee2e2}.base.green .pocket{background:#dcfce7}.base.yellow .pocket{background:#fef9c3}.base.blue .pocket{background:#dbeafe}
.center-home{grid-area:7/7/10/10;background:conic-gradient(from -45deg,var(--green) 0 90deg,var(--yellow) 90deg 180deg,var(--blue) 180deg 270deg,var(--red) 270deg 360deg);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1px;padding:4px;border:1px solid #64748b}
.tk{width:78%;height:78%;max-width:34px;max-height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 3px 6px rgba(0,0,0,.45),inset 0 2px 2px rgba(255,255,255,.55);z-index:2;transition:transform .15s;flex-shrink:0}
.tk.red{background:radial-gradient(circle at 35% 35%,#fca5a5,#dc2626 60%,#991b1b)}
.tk.green{background:radial-gradient(circle at 35% 35%,#86efac,#16a34a 60%,#166534)}
.tk.yellow{background:radial-gradient(circle at 35% 35%,#fde68a,#ca8a04 60%,#854d0e)}
.tk.blue{background:radial-gradient(circle at 35% 35%,#93c5fd,#2563eb 60%,#1e40af)}
.tk.mini{width:30%;height:30%;max-width:none;max-height:none}
.tk.s2{width:48%;height:48%}.tk.s3{width:42%;height:42%}.tk.s4{width:44%;height:44%}
.tk.movable{cursor:pointer;z-index:5;animation:pulse .8s infinite alternate}
.tk.moved{animation:pop .35s}
@keyframes pulse{from{transform:scale(1);box-shadow:0 0 0 2px #fff,0 0 8px 3px rgba(245,158,11,.8)}to{transform:scale(1.18);box-shadow:0 0 0 3px #fff,0 0 14px 6px rgba(245,158,11,1)}}
@keyframes pop{0%{transform:scale(1.7)}100%{transform:scale(1)}}

.dice-row{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0}
.die{width:76px;height:76px;border-radius:18px;background:#fff;color:#0f172a;font-size:3.4rem;line-height:76px;text-align:center;box-shadow:0 8px 16px rgba(0,0,0,.4),inset 0 -3px 5px rgba(0,0,0,.15);user-select:none}
.die.rolling{animation:roll .5s ease-in-out}
.die.ready{cursor:pointer;outline:3px solid var(--warn);animation:bob 1s infinite alternate}
@keyframes roll{0%{transform:rotate(0)}50%{transform:rotate(200deg) scale(1.15)}100%{transform:rotate(360deg)}}
@keyframes bob{to{transform:translateY(-5px)}}
.status{text-align:center;font-weight:700;min-height:1.5em}
.td-card{border-radius:16px;padding:14px;margin:12px 0;border:2px solid;text-align:center;animation:pop .35s}
.td-card.truth{background:#082f49;border-color:#38bdf8}.td-card.dare{background:#4c0519;border-color:#fb7185}
.td-card .kind{font-weight:800;letter-spacing:.15em;font-size:.8rem}
.td-card p{font-size:1.1rem;margin:8px 0 12px}

/* Tic tac toe / C4 / RPS */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:12px auto}
.tcell{aspect-ratio:1;background:var(--panel2);border-radius:16px;font-size:clamp(2.4rem,14vw,4rem);font-weight:800;display:flex;align-items:center;justify-content:center}
.tcell.win{background:#14532d;animation:pop .4s}
.tcell.x{color:#60a5fa}.tcell.o{color:#f472b6}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:440px;margin:10px auto;background:#1d4ed8;padding:10px;border-radius:18px}
.c4cell{aspect-ratio:1;border-radius:50%;background:#0b1220;box-shadow:inset 0 3px 6px rgba(0,0,0,.6)}
.c4cell.p0{background:radial-gradient(circle at 35% 35%,#fca5a5,#dc2626 65%)}
.c4cell.p1{background:radial-gradient(circle at 35% 35%,#fde68a,#ca8a04 65%)}
.c4cell.win{outline:4px solid #fff;animation:pop .4s}.c4cell.last{animation:pop .4s}
.c4cols{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:440px;margin:0 auto;padding:0 10px}
.c4cols button{background:var(--panel2);border-radius:10px;padding:8px 0;font-size:1.1rem}
.rps-row{display:flex;gap:12px;justify-content:center;margin:16px 0}
.rps-btn{width:92px;height:92px;border-radius:22px;background:var(--panel2);font-size:2.8rem;border:3px solid transparent}
.rps-btn.sel{border-color:var(--good)}
.reveal{display:flex;align-items:center;justify-content:center;gap:18px;font-size:3.2rem;margin:12px 0}
.hist{list-style:none;padding:0;margin:0;font-size:.85rem}
.hist li{padding:6px 0;border-bottom:1px solid var(--line)}

/* social panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
#social .panel{height:100%}
@media(min-width:861px){#social{position:sticky;top:64px;align-self:flex-start;max-height:calc(100vh - 80px)}#social .panel{max-height:calc(100vh - 80px)}}
.chat-log{flex:1;min-height:160px;max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
@media(max-width:860px){.chat-log{max-height:36vh}}
.msg{background:#0b1220;border-radius:12px;padding:7px 11px;max-width:92%;word-wrap:break-word;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:#312e81}
.msg .who{font-size:.72rem;font-weight:700;color:var(--accent2);display:block}
.msg.sys{align-self:center;background:none;color:var(--mute);font-size:.78rem;text-align:center}
.chat-in{display:flex;gap:8px}.chat-in input{padding:10px 12px}
.emojis{display:flex;gap:6px;flex-wrap:wrap}.emojis button{background:var(--panel2);border-radius:10px;padding:4px 9px;font-size:1.1rem}
.voice-row{display:flex;gap:8px;flex-wrap:wrap}
.sheet-head{display:flex;justify-content:space-between;align-items:center}

#toasts{position:fixed;left:0;right:0;top:64px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none}
.toast{background:#0b1220;border:1px solid var(--line);padding:10px 16px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.5);animation:pop .25s;max-width:90vw}
.toast.err{border-color:var(--bad)}.toast.good{border-color:var(--good)}
#overlay{position:fixed;inset:0;background:rgba(2,6,23,.92);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
#overlay .box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;max-width:380px;width:100%;text-align:center}
#overlay .big{font-size:3.4rem}
#audio-sink{position:absolute;width:0;height:0;overflow:hidden}
.note{background:#1e1b4b;border:1px solid #4338ca;border-radius:12px;padding:10px 12px;font-size:.85rem}

.fab.mic{right:14px;bottom:calc(84px + env(safe-area-inset-bottom));width:48px;height:48px;font-size:1.3rem;background:#15803d}
.fab.mic.muted{background:#b91c1c}
@media(min-width:861px){.fab.mic{display:none!important}}

/* emoji reactions */
#emoji-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:34;display:flex;gap:4px;background:rgba(11,18,32,.94);border:1px solid var(--line);border-radius:99px;padding:5px 8px;max-width:calc(100vw - 150px);overflow-x:auto;scrollbar-width:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#emoji-bar::-webkit-scrollbar{display:none}
#emoji-bar button{font-size:1.5rem;line-height:1;padding:6px 7px;border-radius:50%;flex-shrink:0;transition:transform .1s}
#emoji-bar button:active{transform:scale(1.4)}
@media(min-width:861px){#emoji-bar{max-width:640px}}
#stage{padding-bottom:84px}
#reactions{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.react{position:absolute;bottom:80px;display:flex;flex-direction:column;align-items:center;animation:rise 2.6s ease-out forwards}
.react .re{font-size:2.8rem;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.react .rn{font-size:.7rem;font-weight:700;background:rgba(11,18,32,.85);border-radius:99px;padding:1px 8px;margin-top:-2px}
@keyframes rise{0%{transform:translateY(0) scale(.4);opacity:0}12%{transform:translateY(-30px) scale(1.25);opacity:1}100%{transform:translateY(-55vh) scale(1) rotate(8deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.react{animation-duration:1.6s}}

.cats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.cat{background:var(--panel2);border:2px solid transparent;border-radius:99px;padding:7px 13px;font-size:.88rem;font-weight:600}
.cat.on{border-color:var(--accent2);background:#312e81}

.seat-row.speaking{background:rgba(34,197,94,.12);border-radius:10px;padding:4px 8px;outline:2px solid var(--good)}
.mic-meter{width:100%;height:7px;background:#0b1220;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.mic-meter-fill{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);transition:width .1s ease-out}

</style>
</head>
<body>
  <header class="topbar">
    <button id="btn-home" class="logo" aria-label="Home">🎲 <span>Game Hub</span></button>
    <div class="top-right">
      <span id="net-badge" class="badge" hidden></span>
      <button id="btn-sound" class="icon-btn" aria-label="Toggle sound">🔊</button>
    </div>
  </header>

  <div id="boot-error" style="padding:20px;font:16px system-ui;color:#fecaca;background:#7f1d1d">⚠️ Game Hub could not load its files. Upload the <b>whole</b> project with its <b>css/</b> and <b>js/</b> folders (or use the single-file <b>index.html</b> version), then refresh.</div>

  <main id="layout">
    <section id="stage"></section>
    <aside id="social" hidden></aside>
  </main>

  <button id="mic-fab" class="fab mic" hidden aria-label="Mute microphone">🎤</button>
  <button id="social-fab" class="fab" hidden aria-label="Open chat">💬<i id="unread" hidden>0</i></button>
  <div id="reactions" aria-hidden="true"></div>
  <div id="emoji-bar" hidden role="toolbar" aria-label="Send a reaction"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="overlay" hidden></div>
  <div id="audio-sink"></div>

  <noscript>This app needs JavaScript.</noscript>
  <script>window.GAMEHUB_SERVER="";</script>
  <script>
/**
 * Game Hub – shared game logic (runs in the browser AND in Node).
 * Every game is a pure state machine:  apply(state, action, seat, rng) -> { events } | { error }
 * The server uses it for online rooms, the browser uses it for offline play.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.GameLogic = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const rint = (rng, n) => Math.floor(rng() * n);
  const pick = (rng, arr) => arr[rint(rng, arr.length)];

  /* ------------------------------------------------------------------ */
  /*  Truth & Dare decks. Categories: love, oneside, funny, deep         */
  /*  (shared by the Truth-or-Dare game and Ludo captures)               */
  /* ------------------------------------------------------------------ */
  const CATS = [
    { id: 'mix', label: '🎲 Mix' }, { id: 'love', label: '💕 Love' }, { id: 'oneside', label: '💔 One-sided' },
    { id: 'funny', label: '😂 Funny' }, { id: 'deep', label: '🧠 Serious' }
  ];
  const CAT_NAME = { love: '💕 Love', oneside: '💔 One-sided love', funny: '😂 Funny', deep: '🧠 Serious', mix: '🎲 Mix' };
  const Q = (c, t) => ({ c, t });
  const TRUTH_CARDS = [
    /* ---- love ---- */
    Q('love', "If someone truly loves you, will you accept them or not? Why?"),
    Q('love', "Do you know someone who loves you every day but can't tell you?"),
    Q('love', "What does \"love\" mean in your own words?"),
    Q('love', "Someone you were once close to calls and asks, \"Do you still love me or not?\" What do you say?"),
    Q('love', "Who do you share all your problems and gossip with?"),
    Q('love', "You know someone loves you, but you see them only as a friend. When they come to meet you, how will you introduce them to your friends?"),
    Q('love', "What's the first thing you notice about a person you like?"),
    Q('love', "What's your idea of a perfect first date?"),
    Q('love', "What's more important in love: looks, nature or money? Why?"),
    Q('love', "Do you believe in love at first sight?"),
    Q('love', "What's the sweetest thing anyone has ever done for you?"),
    Q('love', "What qualities do you want in your life partner?"),
    Q('love', "What's the most embarrassing thing you've done to impress a crush?"),
    Q('love', "What was your worst date or hang-out ever?"),
    /* ---- one-sided love ---- */
    Q('oneside', "Have you ever loved someone who didn't love you back? How did you handle it?"),
    Q('oneside', "If your one-sided crush suddenly said \"I love you\" today, what would be your first reaction?"),

  const L_COLORS = ['red', 'green', 'yellow', 'blue'];

        if (best !== -1) { s.tokens[color][best] -= 2; ev[0].penalty = { color, token: best }; }

      }

      const from = s.tokens[color][t];

          });

        ev.push({ type: 'win', seat, color });

  const TTT_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

      S.online ? h('div', { class: 'row' }, isHost && h('button', { class: 'btn sm sec', text: 'Back to lobby', on: { click: () => { if (s.over || confirm('End the game for everyone?')) Net.send('room:lobby'); } } }),
                  h('button', { class: 'btn sm sec', text: 'Leave', on: { click: () => { if (confirm('Leave this game?')) leaveRoom(); } } }))
               : h('button', { class: 'btn sm sec', text: '☰ Menu', on: { click: () => { if (s.over || confirm('Leave this game?')) { S.stop(); App.session = null; viewHome(); } } } }));
    const body = h('div');
    R[s.game](S, body);
    setStage(top, body);
    updateSpeaking();
    // pass-and-play hand-over screen (Rock Paper Scissors)
    if (!S.online && S.curtain !== null) {
      const next = S.names[S.curtain];
      $('#overlay').hidden = false;
      $('#overlay').replaceChildren(h('div', { class: 'box' }, h('div', { class: 'big', text: '🙈' }), h('h2', { text: 'Pass the device to ' + next }), h('p', { class: 'mute', text: 'Your friend picked in secret. Now it is your turn – no peeking!' }),
        h('button', { class: 'btn block', text: "I'm " + next + ' – ready', on: { click: () => { S.curtain = null; $('#overlay').hidden = true; renderGame(); } } })));
    } else $('#overlay').hidden = true;
  }

  function pbar(S, items) {
    return h('div', { class: 'pbar' }, items.map(it => {
      const p = S.online && App.room ? App.room.players[it.seat] : null;
      return h('div', { class: 'pchip' + (it.turn ? ' turn' : '') + (S.online && S.seat === it.seat ? ' me' : '') + (p && !p.connected ? ' off' : ''), 'data-pid': p ? p.pid : null },
        it.dot && h('span', { class: 'dot c-' + it.dot }), it.mark && h('b', { text: it.mark }),
        h('span', { text: (S.names[it.seat] || 'Player') + (S.isBot(it.seat) ? ' 🤖' : '') + (p && !p.connected ? ' (bot)' : '') }),
        it.extra != null && h('span', { class: 'score', text: it.extra }), p && p.voice && h('span', { text: p.muted ? '🔇' : '🎤' }));
    }));
  }
  /* DOM append that skips null/false (native append would print the words "null"/"false") */
  const add = (el, ...kids) => el.append(...kids.flat().filter(k => k != null && k !== false));
  const nameOf = (S, i) => S.names[i] || 'Player';
  function rematchBtn(S, label) {
    return h('button', { class: 'btn block', style: 'margin-top:12px', text: label || '🔁 Play again', on: { click: () => S.send({ type: 'rematch' }, S.online ? undefined : 0) } });
  }

  /* ---------------------------- LUDO ---------------------------- */
  const TRACK = (() => {
    const t = [];
    for (let c = 1; c <= 5; c++) t.push([6, c]);
    for (let r = 5; r >= 0; r--) t.push([r, 6]);
    t.push([0, 7]);
    for (let r = 0; r <= 5; r++) t.push([r, 8]);
    for (let c = 9; c <= 14; c++) t.push([6, c]);
    t.push([7, 14]);
    for (let c = 14; c >= 9; c--) t.push([8, c]);
    for (let r = 9; r <= 14; r++) t.push([r, 8]);
    t.push([14, 7]);
    for (let r = 14; r >= 9; r--) t.push([r, 6]);
    for (let c = 5; c >= 0; c--) t.push([8, c]);
    t.push([7, 0]); t.push([6, 0]);
    return t;
  })();
  const HOMECOL = {
    red: [1, 2, 3, 4, 5].map(c => [7, c]), green: [1, 2, 3, 4, 5].map(r => [r, 7]),
    yellow: [13, 12, 11, 10, 9].map(c => [7, c]), blue: [13, 12, 11, 10, 9].map(r => [r, 7])
  };
  const BASES = { red: [1, 1], green: [1, 10], yellow: [10, 10], blue: [10, 1] };
  const FACES = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

  function ludoBoard(S, act) {
    const s = S.state, board = h('div', { class: 'ludo', role: 'img', 'aria-label': 'Ludo board' });
    const cells = new Map(), pockets = {};
    const mk = (r, c, cls) => { const el = h('div', { class: 'lc ' + (cls || ''), style: 'grid-row:' + (r + 1) + ';grid-column:' + (c + 1) }); cells.set(r + ',' + c, el); board.append(el); return el; };
    GL.L_COLORS.forEach(color => {
      const [r, c] = BASES[color];
      const inner = h('div', { class: 'base-in' });
      pockets[color] = [0, 1, 2, 3].map(() => { const p = h('div', { class: 'pocket' }); inner.append(p); return p; });
      board.append(h('div', { class: 'base ' + color, style: 'grid-area:' + r + '/' + c + '/' + (r + 6) + '/' + (c + 6) }, inner));
    });
    TRACK.forEach((rc, i) => {
      const startColor = GL.L_COLORS.find(c => GL.L_OFFSET[c] === i);
      mk(rc[0], rc[1], (startColor ? 'start-' + startColor + ' ' : '') + (GL.L_SAFE.includes(i) ? 'safe' : ''));
    });
    GL.L_COLORS.forEach(color => HOMECOL[color].forEach(rc => mk(rc[0], rc[1], 'home-' + color)));
    const center = h('div', { class: 'center-home' }); board.append(center);

    const groups = new Map();
    const put = (el, token) => { if (!groups.has(el)) groups.set(el, []); groups.get(el).push(token); };
    const turnColor = s.colors[s.turn];
    s.colors.forEach(color => s.tokens[color].forEach((pos, i) => {
      let target;
      if (pos === -1) target = pockets[color][i];
      else if (pos === 56) target = center;
      else if (pos <= 50) { const rc = TRACK[(GL.L_OFFSET[color] + pos) % 52]; target = cells.get(rc[0] + ',' + rc[1]); }
      else { const rc = HOMECOL[color][pos - 51]; target = cells.get(rc[0] + ',' + rc[1]); }
      put(target, { color, i, pos });
    }));
    groups.forEach((list, el) => {
      list.forEach(t => {
        const movable = !s.over && s.rolled && act === s.turn && t.color === turnColor && s.valid.includes(t.i);
        const moved = App.anim.moved && App.anim.moved.color === t.color && App.anim.moved.token === t.i;
        const cls = 'tk ' + t.color + (el === center ? ' mini' : list.length > 1 ? (list.length === 2 ? ' s2' : list.length === 3 ? ' s3' : ' s4') : '') + (movable ? ' movable' : '') + (moved ? ' moved' : '');
        el.append(h('div', { class: cls, role: movable ? 'button' : null, tabindex: movable ? '0' : null, 'aria-label': movable ? 'Move ' + t.color + ' token ' + (t.i + 1) : null,
          on: movable ? { click: () => S.send({ type: 'move', token: t.i }, act), keydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); S.send({ type: 'move', token: t.i }, act); } } } : null }));
      });
    });
    App.anim.moved = null;
    return board;
  }

  function renderLudo(S, root) {
    const s = S.state, act = S.actSeat();
    const canRoll = !s.over && act === s.turn && !s.rolled;
    const die = h('div', { class: 'die' + (canRoll ? ' ready' : '') + (App.anim.roll ? ' rolling' : ''), role: 'button', tabindex: canRoll ? '0' : '-1', 'aria-label': canRoll ? 'Roll the dice' : 'Dice',
      text: s.last ? FACES[s.last.dice - 1] : '🎲', on: { click: () => canRoll && S.send({ type: 'roll' }, act), keydown: (e) => { if (canRoll && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); S.send({ type: 'roll' }, act); } } } });
    App.anim.roll = false;
    let status;
    if (s.over) status = '🏆 ' + nameOf(S, s.winner) + ' wins!';
    else if (act === s.turn) status = s.rolled ? 'Tap a glowing token to move' : (S.online ? "It's your turn – roll!" : nameOf(S, s.turn) + ' – tap the dice!');
    else status = nameOf(S, s.turn) + (S.isBot(s.turn) ? ' is thinking…' : "'s turn…");
    const items = s.colors.map((c, i) => ({ seat: i, dot: c, turn: !s.over && i === s.turn, extra: '🏁 ' + s.tokens[c].filter(p => p === 56).length + '/4' }));
    add(root, pbar(S, items), h('div', { class: 'board-wrap' }, ludoBoard(S, act)),
      h('div', { class: 'dice-row' }, die),
      h('div', { class: 'status', text: status }),
      s.last && !s.over && h('div', { class: 'mute small center', text: nameOf(S, s.last.seat) + ' rolled a ' + s.last.dice + (s.last.dice === 6 ? ' – roll again after moving!' : '') }));
    if (s.td) {
      const td = s.td, mine = S.online ? S.seat === td.judge : !S.isBot(td.target);
      add(root, h('div', { class: 'td-card ' + td.kind }, h('div', { class: 'kind', text: td.kind === 'dare' ? '😈 DARE' : '🤔 TRUTH' }),
        h('div', { class: 'mute small', text: nameOf(S, td.target) + ' was captured by ' + nameOf(S, td.judge) }), h('p', { text: td.prompt }),
        mine ? h('div', { class: 'row', style: 'justify-content:center' },
          h('button', { class: 'btn good sm', text: '✅ Completed', on: { click: () => S.send({ type: 'td-resolve', completed: true }, td.judge) } }),
          h('button', { class: 'btn bad sm', text: '❌ Skipped (−2 steps)', on: { click: () => S.send({ type: 'td-resolve', completed: false }, td.judge) } }))
          : h('div', { class: 'mute small', text: S.online ? nameOf(S, td.judge) + ' decides if it was done.' : 'The computer will move on shortly.' })));
    }
    if (s.over) add(root, S.online ? h('div', { class: 'note center', text: 'Host can go back to the lobby to play again.' }) : h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'btn grow', text: '🔁 Play again', on: { click: () => S.restart() } })));
  }

  /* ---------------------- TIC-TAC-TOE ---------------------- */
  function scoreItems(S, s) {
    return [0, 1].map(i => ({ seat: i, mark: s.game === 'ttt' ? (i === 0 ? '❌' : '⭕') : (i === 0 ? '🔴' : '🟡'), turn: !s.over && i === s.turn, extra: s.scores[i] }));
  }
  function turnText(S, s, act) {
    if (s.over) return s.draw ? "It's a draw!" : '🏆 ' + nameOf(S, s.winner) + ' wins this round!';
    if (act === s.turn) return S.online ? 'Your turn!' : nameOf(S, s.turn) + ', your turn!';
    return nameOf(S, s.turn) + (S.isBot(s.turn) ? ' is thinking…' : "'s turn…");
  }
  function renderTTT(S, root) {
    const s = S.state, act = S.actSeat();
    const grid = h('div', { class: 'ttt' }, s.board.map((v, i) => h('button', { class: 'tcell ' + (v === 0 ? 'x' : v === 1 ? 'o' : '') + (s.line && s.line.includes(i) ? ' win' : ''), text: v === 0 ? '✕' : v === 1 ? '○' : '',
      'aria-label': 'Cell ' + (i + 1), disabled: s.over || v !== null || act !== s.turn, on: { click: () => S.send({ type: 'place', cell: i }, act) } })));
    add(root, pbar(S, scoreItems(S, s)), h('div', { class: 'status', text: turnText(S, s, act) }), grid,
      h('div', { class: 'mute small center', text: 'Round ' + s.round + ' · Draws: ' + s.scores[2] }), s.over && rematchBtn(S, '🔁 Next round'));
  }

  /* ---------------------- CONNECT FOUR ---------------------- */
  function renderC4(S, root) {
    const s = S.state, act = S.actSeat();
    const colsFull = (c) => s.board[c] !== null;
    const heads = h('div', { class: 'c4cols' }, [0, 1, 2, 3, 4, 5, 6].map(c => h('button', { text: '⬇', 'aria-label': 'Drop in column ' + (c + 1), disabled: s.over || act !== s.turn || colsFull(c), on: { click: () => S.send({ type: 'drop', col: c }, act) } })));
    const grid = h('div', { class: 'c4' }, s.board.map((v, i) => h('div', { class: 'c4cell' + (v !== null ? ' p' + v : '') + (s.line && s.line.includes(i) ? ' win' : '') + (s.lastCell === i ? ' last' : '') })));
    add(root, pbar(S, scoreItems(S, s)), h('div', { class: 'status', text: turnText(S, s, act) }), heads, grid,
      h('div', { class: 'mute small center', text: 'Round ' + s.round + ' · Draws: ' + s.scores[2] }), s.over && rematchBtn(S, '🔁 Next round'));
  }

  /* ---------------------- ROCK PAPER SCISSORS ---------------------- */
  const RPS_E = { rock: '🪨', paper: '📄', scissors: '✂️' };
  function renderRPS(S, root) {
    const s = S.state, act = S.actSeat();
    const picked = s.picked || s.choices.map(c => c !== null);
    const items = [0, 1].map(i => ({ seat: i, turn: !s.over && !picked[i], extra: s.scores[i], mark: picked[i] && !s.over ? '✅' : null }));
    add(root, pbar(S, items), h('div', { class: 'mute small center', text: 'First to ' + s.target + ' wins · Round ' + Math.min(s.round, 99) }));
    if (s.last) {
      const res = s.last.result;
      add(root, h('div', { class: 'reveal' }, h('span', { text: RPS_E[s.last.choices[0]] }), h('span', { class: 'small mute', text: 'vs' }), h('span', { text: RPS_E[s.last.choices[1]] })),
        h('div', { class: 'status', text: res === 'draw' ? 'Draw!' : nameOf(S, res) + ' wins the round' }));
    } else add(root, h('div', { class: 'status', text: 'Pick your move!' }));
    if (s.over) add(root, h('div', { class: 'status', text: '🏆 ' + nameOf(S, s.winner) + ' wins the match!' }), rematchBtn(S, '🔁 New match'));
    else if (act !== null && s.choices[act] === null && !(picked[act] && S.online)) {
      add(root, h('div', { class: 'status', style: 'margin-top:10px', text: S.online ? 'Choose:' : nameOf(S, act) + ', choose:' }),
        h('div', { class: 'rps-row' }, Object.keys(RPS_E).map(k => h('button', { class: 'rps-btn', text: RPS_E[k], 'aria-label': k, on: { click: () => S.send({ type: 'pick', choice: k }, act) } }))));
    } else add(root, h('div', { class: 'status mute', text: 'Locked in ✅ – waiting for the other player…' }));
  }

  /* ---------------------- TRUTH OR DARE ---------------------- */
  function renderTOD(S, root) {
    const s = S.state, act = S.actSeat(), local = !S.online;
    const items = s.scores.map((v, i) => ({ seat: i, turn: i === s.turn, extra: v }));
    add(root, pbar(S, items), h('div', { class: 'mute small center', text: 'Round ' + s.round + ' · each completed challenge scores a point' }));
    const you = (local || act === s.turn);
    if (s.phase === 'choose') {
      add(root, h('div', { class: 'status', text: you ? (local ? nameOf(S, s.turn) + ', truth or dare?' : 'Your turn – truth or dare?') : nameOf(S, s.turn) + ' is choosing…' }));
      if (you) {
        const pick = (kind) => S.send({ type: 'choose', kind, cat: App.todCat }, s.turn);
        add(root, h('div', { class: 'cats', role: 'group', 'aria-label': 'Question type' }, GL.CATS.map(c => h('button', { class: 'cat' + (App.todCat === c.id ? ' on' : ''), text: c.label, on: { click: () => { App.todCat = c.id; renderGame(); } } }))),
          h('div', { class: 'row', style: 'justify-content:center;margin-top:12px' },
            h('button', { class: 'btn', style: 'background:#0369a1', text: '🤔 Truth', on: { click: () => pick('truth') } }),
            h('button', { class: 'btn', style: 'background:#be123c', text: '😈 Dare', on: { click: () => pick('dare') } }),
            h('button', { class: 'btn sec', text: '🎲 Random', on: { click: () => pick('random') } })),
          h('div', { class: 'mute small center', style: 'margin-top:8px', text: 'You can swap a question once. Be kind – nobody is forced to share more than they want.' }));
      }
    } else {
      const c = s.card, judgeSeat = local ? (s.turn + 1) % s.n : act;
      const canJudge = local || (act !== null && act !== s.turn);
      add(root, h('div', { class: 'td-card ' + c.kind }, h('div', { class: 'kind', text: (c.kind === 'dare' ? '😈 DARE' : '🤔 TRUTH') + ' for ' + nameOf(S, s.turn) }), c.cat && h('div', { class: 'mute small', text: GL.CAT_NAME[c.cat] }), h('p', { text: c.prompt }),
        you && !c.swapped && h('button', { class: 'btn sm sec', text: '🔄 Swap (once)', on: { click: () => S.send({ type: 'swap' }, s.turn) } })),
        canJudge ? h('div', { class: 'row', style: 'justify-content:center' },
          h('button', { class: 'btn good', text: '✅ Done', on: { click: () => S.send({ type: 'judge', done: true }, judgeSeat) } }),
          h('button', { class: 'btn bad', text: '❌ Skipped', on: { click: () => S.send({ type: 'judge', done: false }, judgeSeat) } }))
          : h('div', { class: 'status mute', text: 'Do it! Your friends will judge.' }));
      if (canJudge) add(root, h('div', { class: 'mute small center', style: 'margin-top:6px', text: local ? 'Everyone else decides whether ' + nameOf(S, s.turn) + ' did it.' : 'Did ' + nameOf(S, s.turn) + ' do it?' }));
    }
    if (s.history.length) add(root, h('div', { class: 'card', style: 'margin-top:14px' }, h('h3', { text: 'Recent' }),
      h('ul', { class: 'hist' }, s.history.map(x => h('li', {}, (x.done ? '✅ ' : '❌ ') + nameOf(S, x.seat) + ' – ' + (x.kind === 'dare' ? 'Dare: ' : 'Truth: ') + x.prompt)))));
  }
  const R = { ludo: renderLudo, ttt: renderTTT, c4: renderC4, rps: renderRPS, tod: renderTOD };

  /* ===================================================================
     NETWORK HOOKS
     =================================================================== */
  Net.on('room:update', (room) => { App.room = room; onRoomUpdate(); });
  Net.on('game:state', ({ state, events: evs, seat }) => {
    if (!App.room) return;
    if (!App.session || !App.session.online) { App.session = new OnlineSession(seat, state); }
    App.session.state = state; App.session.seat = seat;
    App.view = 'game';
    events(App.session, evs); renderGame();
  });
  Net.on('game:end', () => { App.session = null; toast('Back to the lobby'); });
  Net.on('game:error', (msg) => toast(msg, 'err'));
  Net.on('chat:msg', (m) => {
    App.chat.push(m); if (App.chat.length > 150) App.chat.shift();
    addMsg(m);
    if (!m.system && m.pid !== Net.pid) { SFX.chat(); if (!$('#social').classList.contains('open') && window.innerWidth <= 860) { App.unread++; updateUnread(); } }
  });
  Net.on('emoji:show', (m) => { floatEmoji(m.emoji, m.pid === Net.pid ? 'You' : m.name); if (m.pid !== Net.pid) SFX.pop(); });
  Net.on('kicked', (msg) => { toast(msg, 'err'); leaveRoom(); });
  Net.on('rejoined', (r) => { App.room = r.room; toast('Reconnected', 'good'); onRoomUpdate(); Voice.rejoin(); });
  const badge = $('#net-badge');
  Net.on('status', (st) => {
    badge.className = 'badge ' + (st === 'online' ? 'on' : st === 'connecting' ? 'mid' : 'off');
    badge.textContent = st === 'online' ? '● Online' : st === 'connecting' ? '● Reconnecting…' : '● Disconnected';
    badge.hidden = !App.room;
  });
  Net.on('browser-offline', () => { toast("You're offline – offline games still work 📴"); if (App.view === 'home') viewHome(); });
  Net.on('browser-online', () => { toast('Back online 🌐', 'good'); if (App.view === 'home') viewHome(); });

  /* ===================================================================
     BOOT
     =================================================================== */
  const be = document.getElementById('boot-error'); if (be) be.remove();
  $('#btn-sound').textContent = soundOn ? '🔊' : '🔇';
  $('#btn-sound').addEventListener('click', () => { soundOn = !soundOn; store.set('sound', soundOn); $('#btn-sound').textContent = soundOn ? '🔊' : '🔇'; if (soundOn) SFX.tick(); });
  $('#btn-home').addEventListener('click', () => {
    if (App.session && !App.session.state.over && !confirm('Leave the current game?')) return;
    if (App.session && !App.session.online) App.session.stop();
    if (App.room) { if (!confirm('Leave the room?')) return; leaveRoom(); return; }
    App.session = null; viewHome();
  });
  buildEmojiBar();
  $('#social-fab').addEventListener('click', () => toggleSocial());
  $('#mic-fab').addEventListener('click', () => Voice.setMuted(!Voice.muted));
  // mobile browsers sometimes pause remote audio until the next tap: resume it
  document.addEventListener('click', () => { document.querySelectorAll('#audio-sink audio').forEach(a => { if (a.paused && a.srcObject) a.play().catch(() => {}); }); if (Voice.ctx && Voice.ctx.state === 'suspended') Voice.ctx.resume(); });

  const roomParam = new URLSearchParams(location.search).get('room');
  if (roomParam) viewOnlineEntry(roomParam.toUpperCase().slice(0, 5)); else viewHome();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  window.__hub = { App, GL };   // handy for debugging in the console
})();

</script>
</body>
</html>
